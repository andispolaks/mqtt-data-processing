services:

  postgres:
    image: postgres:17-alpine
    container_name: mqtt_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mqtt_data
      POSTGRES_USER: mqtt_user
      POSTGRES_PASSWORD: mqtt_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqtt_user -d mqtt_data"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: mqtt_rabbitmq
    hostname: mqtt-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s


  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mqtt_consumer
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


volumes:
  postgres_data:
  rabbitmq_data: